name: E2E (Better-T-Stack monorepo)

# Realistic monorepo e2e job: bun + turbo (Next.js web, Hono/tRPC server,
# better-auth, Drizzle/Postgres), production build, Playwright on
# chromium/firefox/webkit with seed/cleanup projects and CI retries.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run (self-hosted = Lima VM, github = GitHub-hosted ubuntu-24.04, macos = native macOS runner)
        type: choice
        options: [self-hosted, github, macos]
        default: self-hosted
      workers:
        description: JSON list of Playwright worker counts
        default: "[1]"
      copies:
        description: 'JSON list; one identical job per entry, run at once (e.g. "[1,2,3]" = 3 concurrent PRs)'
        default: "[1]"
      repeat_each:
        description: Run every test N times (scales the suite)
        default: "1"
      skip_webkit:
        description: Skip the WebKit project (what feature PRs would run)
        type: boolean
        default: false
      max_parallel:
        description: Max matrix jobs at once (1 = sweep without overlap)
        default: "1"

jobs:
  e2e:
    name: e2e ${{ inputs.runner }} (workers=${{ matrix.workers }}, copy ${{ matrix.copy }})
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-24.04' || inputs.runner == 'macos' && fromJSON('["self-hosted", "macOS", "native"]') || fromJSON('["self-hosted", "lima"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        workers: ${{ fromJSON(inputs.workers) }}
        copy: ${{ fromJSON(inputs.copies) }}
    services:
      postgres:
        # Service containers are Linux-only; an empty image skips it and the macOS step below starts Postgres.
        image: ${{ inputs.runner != 'macos' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        # Random host port so concurrent runners in one VM don't clash.
        ports: ["5432/tcp"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      E2E_SKIP_WEBKIT: ${{ inputs.skip_webkit }}
      BETTER_AUTH_SECRET: e2e-not-a-secret-but-long-enough-32ch
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      # Native macOS runners use the host's bun; setup-bun would overwrite ~/.bun/bin under parallel jobs.
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
        with:
          bun-version-file: app/package.json

      # Several runners share one machine, so each gets its own API/web ports (<name>-N -> base+10(N-1)).
      - name: Configure ports and database
        run: |
          n=0; [[ $RUNNER_NAME =~ -([0-9]+)$ ]] && n=$(( BASH_REMATCH[1] - 1 ))
          base=3000; [ "$RUNNER_OS" = macOS ] && base=4000  # keep clear of local dev servers on 3001-3003
          api=$(( base + n * 10 )) web=$(( base + 1 + n * 10 ))
          {
            echo "DATABASE_URL=postgresql://postgres:password@localhost:${{ job.services.postgres.ports['5432'] }}/app"
            echo "PORT=$api"; echo "API_PORT=$api"; echo "WEB_PORT=$web"
            echo "BETTER_AUTH_URL=http://localhost:$api"
            echo "NEXT_PUBLIC_SERVER_URL=http://localhost:$api"
            echo "CORS_ORIGIN=http://localhost:$web"
          } >> "$GITHUB_ENV"

      - name: Start Postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          name="pg-$GITHUB_RUN_ID-$RUNNER_NAME"
          docker run -d --rm --name "$name" -e POSTGRES_PASSWORD=password -e POSTGRES_DB=app -p 127.0.0.1::5432 postgres:18
          until docker exec "$name" pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          echo "DATABASE_URL=postgresql://postgres:password@localhost:$(docker port "$name" 5432 | head -1 | cut -d: -f2)/app" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and system deps
        working-directory: app/apps/web
        timeout-minutes: 10
        # flock: concurrent runners in one VM would otherwise fight over the apt/dpkg lock.
        run: |
          browsers="chromium firefox"; [ "$E2E_SKIP_WEBKIT" = true ] || browsers="$browsers webkit"
          if [ "$RUNNER_OS" = Linux ]; then
            flock /tmp/playwright-install.lock bunx playwright install --with-deps $browsers
          else
            bunx playwright install $browsers
          fi

      - name: Push DB schema
        working-directory: app/packages/db
        run: bun run db:push

      - name: Build
        run: bun run build

      # VM-wide, so with several runners in one VM it shows their combined load.
      # macOS: sampled host-side for the whole run instead (no vmstat/free/nproc there).
      - name: Start resource sampler
        if: runner.os == 'Linux'
        run: |
          nohup vmstat -n -S M 2 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vmstat.pid"

      - name: Run E2E tests
        working-directory: app/apps/web
        run: bunx playwright test --workers=${{ matrix.workers }} --repeat-each=${{ inputs.repeat_each }}

      - name: Resource usage during tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          kill "$(cat "$RUNNER_TEMP/vmstat.pid")" || true
          awk -v total="$(free -m | awk '/^Mem:/ {print $2}')" -v cpus="$(nproc)" -f "$GITHUB_WORKSPACE/runner/vmstat-summary.awk" \
            "$RUNNER_TEMP/vmstat.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: ${{ !cancelled() && hashFiles('app/apps/web/test-results/results.json') != '' }}
        working-directory: app/apps/web
        run: |
          jq -r --arg w "${{ matrix.workers }} copy ${{ matrix.copy }} on ${{ inputs.runner }}" '.stats |
            "## E2E workers=\($w)\n| passed | failed | flaky | skipped | duration |\n|---|---|---|---|---|\n| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) | \(.duration/1000|floor)s |"' \
            test-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.runner }}-w${{ matrix.workers }}-c${{ matrix.copy }}
          path: app/apps/web/playwright-report/
          retention-days: 7

      - name: Stop Postgres (macOS)
        if: ${{ always() && runner.os == 'macOS' }}
        run: docker rm -f "pg-$GITHUB_RUN_ID-$RUNNER_NAME" || true
